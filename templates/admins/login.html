{% extends 'base/main.html' %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-lg-12">
            <div class="page-content">

                <!-- ***** Login Banner Start ***** -->
                <div class="main-banner">
                    <div class="row justify-content-center">
                        <div class="col-lg-6">
                            <div class="header-text text-center">
                                <h4>Authority Login</h4>
                                
                                <!-- Display Messages -->
                                {% if messages %}
                                    <div class="messages">
                                        {% for message in messages %}
                                            <div class="alert {% if message.tags %}alert-{{ message.tags }}{% endif %} custom-alert">
                                                {{ message }}
                                            </div>
                                        {% endfor %}
                                    </div>
                                {% endif %}

                                <form method="POST" action="" id="loginForm">
                                    {% csrf_token %}
                                    <div class="form-group position-relative">
                                        <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
                                        <span class="validation-icon"></span>
                                    </div><br>
                                    <div class="form-group position-relative">
                                        <input type="password" class="form-control" id="password" name="password" placeholder="Password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" required>
                                        <span class="validation-icon"></span>
                                    </div>
                                    <div class="main-button mt-3">
                                        <button type="submit" class="btn btn-primary">Login</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- ***** Login Banner End ***** -->

            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('loginForm');
    const fields = form.querySelectorAll('.form-control');
    
    fields.forEach((field, index) => {
        field.addEventListener('input', function () {
            validateField(this);
        });

        field.addEventListener('blur', function () {
            if (!validateField(this) && index < fields.length - 1) {
                fields[index + 1].setAttribute('disabled', 'true');
            } else if (index < fields.length - 1) {
                fields[index + 1].removeAttribute('disabled');
            }
        });
    });

    form.addEventListener('submit', function (event) {
        let isFormValid = true;
        fields.forEach(field => {
            if (!validateField(field)) {
                isFormValid = false;
                field.focus();
                return false;
            }
        });

        if (!isFormValid) {
            event.preventDefault();
        }
    });

    function validateField(field) {
        const validationIcon = field.nextElementSibling;
        let isValid = true;

        if (field.id === 'username') {
            const regex = /^[A-Za-z]+$/;
            isValid = regex.test(field.value);
        } else if (field.id === 'password') {
            const regex = /^(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}$/;
            isValid = regex.test(field.value);
        }

        if (isValid) {
            validationIcon.innerHTML = '✔️';
            validationIcon.style.color = 'green';
        } else {
            validationIcon.innerHTML = '❌';
            validationIcon.style.color = 'red';
        }

        return isValid;
    }

    // Timer to hide messages after 5 seconds
    const messagesDiv = document.querySelector('.messages');
    if (messagesDiv) {
        setTimeout(() => {
            messagesDiv.style.display = 'none';
        }, 5000);
    }
});
</script>

<style>
.validation-icon {
    position: absolute;
    right: 10px;
    top: 10px;
    font-size: 1.5rem;
}
.alert {
    margin: 10px 0;
}
.custom-alert.alert-success {
    border: 2px solid green;
    background-color: #d4edda;
    color: #155724;
}
.custom-alert.alert-error, .custom-alert.alert-danger {
    border: 2px solid red;
    background-color: #f8d7da;
    color: #721c24;
}
</style>
{% endblock %}
